name: Build APK

# Builds the debug APK and attaches it to a pre-release, so it can be
# downloaded straight to a phone from the repo's Releases page.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # Optional: sign with your own debug key (base64 of ~/.android/debug.keystore)
      # so the APK installs over an app you built on your own machine. The path is
      # handed to android/app/build.gradle, which uses it for the debug signing config.
      - name: Restore debug keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        if: env.KEYSTORE != ''
        run: |
          printf '%s' "$KEYSTORE" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/debug.keystore"
          echo "ANDROID_DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run apk
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # show which key signed this build, so it can be checked from the Releases page
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          sha1=$("$apksigner" verify --print-certs dist/pomodoro-terrarium.apk | grep -m1 'SHA-1 digest' | awk '{print $NF}')
          echo "Signed with SHA-1 $sha1"
          tag="apk-${{ github.run_number }}"
          gh release create "$tag" dist/pomodoro-terrarium.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "APK #${{ github.run_number }} (${GITHUB_REF_NAME}, ${GITHUB_SHA::7})" \
            --notes "Debug build of ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}. Signing key SHA-1: ${sha1}"
