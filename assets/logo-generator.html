<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pomodoro Terrarium logo exports</title>
<style>
  :root { color-scheme: light; font: 16px system-ui, sans-serif; color: #47394e; background: #f8f3f1; }
  body { max-width: 900px; margin: 32px auto; padding: 0 20px 40px; }
  h1 { font-size: 1.6rem; } p { color: #756879; }
  #exports { display: grid; grid-template-columns: repeat(auto-fit,minmax(200px,1fr)); gap: 14px; margin-top: 24px; }
  .item { padding: 16px; border: 1px solid #e8dfe4; border-radius: 16px; background: #fffdf8; }
  .item img { display: block; width: 100%; height: 170px; object-fit: contain; margin-bottom: 12px; }
  a { color: #69496b; font-weight: 700; }
  button { border: 0; border-radius: 12px; padding: 11px 16px; color: white; background: #684b6b; font: inherit; font-weight: 700; cursor: pointer; }
  #status { margin-left: 10px; color: #64805e; }
</style>
</head>
<body>
<h1>Pomodoro Terrarium logo exports</h1>
<p>Build PNG versions from the vector logo in this folder. The app icon is rendered at 1024px, with web and Apple touch sizes included.</p>
<button id="build">Generate PNGs</button><span id="status"></span>
<div id="exports"></div>
<script>
const loadImage = src => new Promise((resolve, reject) => {
  const img = new Image();
  img.onload = () => resolve(img);
  img.onerror = reject;
  img.src = src;
});
const png = (img, width, height = width, transparent = false) => {
  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  const ctx = canvas.getContext('2d');
  if (!transparent) { ctx.fillStyle = '#fffdf8'; ctx.fillRect(0, 0, width, height); }
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, width, height);
  return canvas.toDataURL('image/png');
};
async function build() {
  const [mark, icon, lockup] = await Promise.all([
    loadImage('logo-mark.svg'), loadImage('app-icon.svg'), loadImage('logo.svg')
  ]);
  return {
    'logo-mark.png': png(mark, 1024, 1024, true),
    'logo-icon.png': png(icon, 1024),
    'favicon.png': png(icon, 32),
    'apple-touch-icon.png': png(icon, 180),
    'logo.png': png(lockup, 1180, 512, true)
  };
}
window.__build = build;
document.querySelector('#build').addEventListener('click', async () => {
  const status = document.querySelector('#status');
  const area = document.querySelector('#exports');
  status.textContent = 'Rendering…'; area.replaceChildren();
  try {
    const files = await build();
    for (const [name, data] of Object.entries(files)) {
      const card = document.createElement('section'); card.className = 'item';
      const preview = document.createElement('img'); preview.src = data; preview.alt = name;
      const link = document.createElement('a'); link.href = data; link.download = name; link.textContent = 'Download ' + name;
      card.append(preview, link); area.append(card);
    }
    status.textContent = 'Ready — download each PNG below.';
  } catch (error) {
    status.textContent = 'Could not load the SVG sources. Serve this page from the project root.';
    console.error(error);
  }
});
</script>
</body>
</html>
